<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Tap Nova Invitaciones — Crea tu invitación digital</title>
  <meta name="description" content="Elige una plantilla, escribe los datos de tu evento y crea tu invitación digital en minutos.">

  <!-- Tipografías (Google Fonts). Si no cargan, el sitio usa letras del sistema y sigue funcionando. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500;600&family=Great+Vibes&family=Dancing+Script:wght@600;700&family=Creepster&display=swap">

  <style>
/*
 * app.css — Estilos de la plataforma (galería, editor, formularios).
 * Estilo inspirado en Apple: mucho aire, tipografía grande, cristal esmerilado,
 * esquinas muy redondeadas y colores de fiesta como acento.
 * Las invitaciones tienen sus propios estilos en templates.css.
 */
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --ink: #1D1D1F;
  --gray: #6E6E73;
  --line: rgba(0, 0, 0, .09);
  --fill: #F2F2F7;
  --blue: #0A84FF;
  --pink: #FF4F8B;
  --orange: #FF9F43;
  --sky: #2FB8F0;
  --grass: #4CCB6A;
  --purple: #8E7CFF;
  --sun: #FFC83D;
  --danger: #D70015;
  --grad: linear-gradient(135deg, #FF4F8B 0%, #FF9F43 100%);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
  --spring: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button { font-family: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid rgba(10, 132, 255, .55); outline-offset: 2px; }
.wrap { width: min(1180px, 100% - 40px); margin-inline: auto; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; background: var(--fill); color: var(--ink); transition: transform .25s var(--spring), box-shadow .25s var(--spring), background .2s; -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 24px -8px rgba(255, 79, 139, .6); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(255, 79, 139, .65); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-sm { min-height: 38px; padding: 0 18px; font-size: 15px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-danger { color: var(--danger); }

/* ---------- Portada ---------- */
.hero { position: relative; overflow: hidden; text-align: center; padding: calc(56px + env(safe-area-inset-top)) 0 0; background: #fff; }
.blobs { position: absolute; inset: 0; pointer-events: none; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(64px); opacity: .5; animation: drift 14s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { width: 340px; height: 340px; left: -80px; top: -60px; background: var(--pink); }
.blobs i:nth-child(2) { width: 300px; height: 300px; right: -60px; top: 40px; background: var(--sky); animation-delay: -4s; }
.blobs i:nth-child(3) { width: 260px; height: 260px; left: 38%; top: 120px; background: var(--sun); animation-delay: -8s; opacity: .4; }
.blobs i:nth-child(4) { width: 220px; height: 220px; right: 14%; top: 280px; background: var(--grass); animation-delay: -2s; opacity: .35; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.12); } }
.hero .wrap { position: relative; }
.eyebrow { font-size: 17px; font-weight: 600; color: var(--pink); margin-bottom: 10px; }
.hero h1 { font-size: clamp(42px, 10.5vw, 88px); line-height: 1.02; font-weight: 800; letter-spacing: -.045em; max-width: 12ch; margin-inline: auto; }
.grad { background: linear-gradient(100deg, #FF4F8B, #FF9F43, #2FB8F0, #8E7CFF, #FF4F8B); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shift 9s linear infinite; }
@keyframes shift { to { background-position: 250% 0; } }
.hero .lead { margin: 20px auto 0; max-width: 34ch; font-size: clamp(19px, 4.6vw, 24px); line-height: 1.3; color: var(--gray); font-weight: 500; letter-spacing: -.02em; }
.hero .cta { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* Teléfonos de muestra */
.showcase { position: relative; display: flex; justify-content: center; align-items: flex-start; height: clamp(310px, 82vw, 470px); margin-top: 44px; overflow: hidden; perspective: 1400px;
  -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.mock { flex: none; width: var(--mw, min(236px, 47vw)); border: 8px solid #1D1D1F; border-radius: 38px; background: #1D1D1F; overflow: hidden; box-shadow: 0 40px 70px -24px rgba(0, 0, 0, .45); transition: transform .6s var(--spring); }
.mock .thumb { aspect-ratio: 390 / 820; border-radius: 0; }
.mock-left { transform: translateX(30%) translateY(36px) rotate(-7deg); z-index: 1; }
.mock-mid { transform: scale(1.1); z-index: 2; }
.mock-right { transform: translateX(-30%) translateY(36px) rotate(7deg); z-index: 1; }
@media (hover: hover) {
  .showcase:hover .mock-mid { transform: scale(1.14) translateY(-10px); }
  .showcase:hover .mock-left { transform: translateX(20%) translateY(26px) rotate(-10deg); }
  .showcase:hover .mock-right { transform: translateX(-20%) translateY(26px) rotate(10deg); }
}

.section { padding: 64px 0 8px; }
.section h2 { font-size: clamp(32px, 7vw, 48px); font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
.section-sub { margin-top: 8px; font-size: 19px; color: var(--gray); }

/* ---------- Filtros ---------- */
.chips { display: flex; gap: 8px; margin: 24px -20px 26px; padding: 4px 20px 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; transition: transform .25s var(--spring), background .2s, color .2s; }
.chip-btn:active { transform: scale(.95); }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* ---------- Galería ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
.card { background: var(--card); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 14px rgba(0, 0, 0, .05); transition: transform .5s var(--spring), box-shadow .5s var(--spring), opacity .6s var(--spring); }
.card.pre { opacity: 0; transform: translateY(30px); }
@media (hover: hover) { .card:hover { transform: translateY(-8px) scale(1.012); box-shadow: 0 30px 50px -22px rgba(0, 0, 0, .28); } }
.thumb { display: block; position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg); }
.thumb-inner { position: absolute; top: 0; left: 0; width: 390px; transform-origin: top left; pointer-events: none; }
.thumb img.cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-link { position: absolute; inset: 0; z-index: 2; }
.card-body { padding: 18px 22px 22px; display: grid; gap: 4px; }
.tag { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--tag, var(--pink)); }
.card h3 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
.card-cta { margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 600; color: var(--blue); text-decoration: none; }
.card-cta span { transition: transform .3s var(--spring); }
.card:hover .card-cta span { transform: translateX(5px); }
.empty { padding: 48px 16px; text-align: center; color: var(--gray); background: #fff; border-radius: 30px; }

/* ---------- Borradores (lista estilo iOS) ---------- */
.drafts { list-style: none; margin: 20px 0 0; padding: 0; background: #fff; border-radius: 24px; overflow: hidden; }
.draft { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 20px; }
.draft + .draft { border-top: 1px solid var(--line); }
.draft strong { display: block; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.draft small { color: var(--gray); font-size: 14px; }
.draft-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.notice { margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: #FFF4D6; color: #6B4B00; font-size: 15px; }

.site-foot { padding: 64px 0 72px; text-align: center; color: var(--gray); font-size: 14px; }

/* ---------- Editor ---------- */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(255, 255, 255, .78); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.navbar .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 52px; }
.nav-back { justify-self: start; display: inline-flex; align-items: center; min-height: 44px; font-size: 17px; color: var(--blue); text-decoration: none; }
.nav-title { text-align: center; line-height: 1.15; min-width: 0; }
.nav-title strong { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.nav-title small { font-size: 12px; color: var(--gray); }
.nav-save { justify-self: end; min-height: 44px; padding: 0 4px; border: 0; background: none; font-size: 17px; font-weight: 600; color: var(--blue); cursor: pointer; }
.editor { padding-top: 52px; }
.editor-grid { width: min(1180px, 100% - 32px); margin: 20px auto 130px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.editor-grid > * { min-width: 0; }

.group { background: var(--card); border-radius: 28px; padding: 22px 20px 8px; margin-bottom: 16px; box-shadow: 0 2px 14px rgba(0, 0, 0, .04); }
.group > h3 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); margin-bottom: 16px; }
.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field > label, .field > span, .field-label { font-size: 15px; font-weight: 600; }
.field input, .field textarea { width: 100%; min-height: 52px; padding: 13px 16px; border: 2px solid transparent; border-radius: 16px; background: var(--fill); color: var(--ink); font: inherit; font-size: 17px; transition: background .2s, border-color .2s, box-shadow .2s; -webkit-appearance: none; appearance: none; }
.field textarea { resize: vertical; line-height: 1.4; }
.field input:focus, .field textarea:focus { outline: none; background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(10, 132, 255, .18); }
.field small { color: var(--gray); font-size: 14px; line-height: 1.35; }
.field small.err { color: var(--danger); font-weight: 600; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.photo-field { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo-thumb { width: 76px; height: 76px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; color: var(--gray); font-size: 13px; overflow: hidden; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-field input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.photo-field label.btn { cursor: pointer; }
.photo-field input[type=file]:focus-visible + label { outline: 3px solid rgba(10, 132, 255, .55); outline-offset: 2px; }
.photo-field [hidden] { display: none; }

.palettes { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
.dot { display: grid; justify-items: center; gap: 6px; padding: 0; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--gray); cursor: pointer; }
.dot i { width: 54px; height: 54px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); transition: transform .3s var(--spring), box-shadow .3s var(--spring); }
.dot:hover i { transform: scale(1.08); }
.dot[aria-checked="true"] i { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.dot[aria-checked="true"] { color: var(--ink); }

.publish-note { font-size: 14px; color: var(--gray); padding-bottom: 14px; }

.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.preview-head p { font-size: 14px; font-weight: 600; color: var(--gray); }
.phone { position: relative; width: 100%; max-width: 400px; margin-inline: auto; background: #1D1D1F; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .35); }
.phone-screen { width: 100%; background: #fff; }

/* Teléfono: pestañas flotantes Editar / Vista previa */
.tabs { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; display: flex; gap: 4px; padding: 5px; background: rgba(255, 255, 255, .8); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-radius: 999px; box-shadow: 0 10px 34px rgba(0, 0, 0, .2), 0 0 0 1px var(--line); }
.tabs button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-size: 16px; font-weight: 600; cursor: pointer; transition: background .25s, color .25s; }
.tabs button.is-active { background: var(--ink); color: #fff; }
.editor[data-tab="edit"] .preview { display: none; }
.editor[data-tab="preview"] .form { display: none; }

/* Pantallas anchas: formulario y vista previa lado a lado */
@media (min-width: 900px) {
  .editor-grid { grid-template-columns: minmax(380px, 480px) 1fr; align-items: start; gap: 32px; margin-bottom: 56px; }
  .editor[data-tab] .form, .editor[data-tab] .preview { display: block; }
  .tabs { display: none; }
  .preview { position: sticky; top: 76px; }
  .phone { width: 372px; height: min(780px, calc(100vh - 290px)); border: 11px solid #1D1D1F; border-radius: 52px; background: #1D1D1F; }
  .phone::before { content: ''; position: absolute; top: 9px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 99px; background: #000; z-index: 5; }
  .phone-screen { height: 100%; overflow-y: auto; scrollbar-width: none; border-radius: 40px; }
  .phone-screen::-webkit-scrollbar { display: none; }
  .hero { padding-top: 96px; }
  .mock-left { transform: translateX(42%) translateY(40px) rotate(-7deg); }
  .mock-right { transform: translateX(-42%) translateY(40px) rotate(7deg); }
}

#toast { position: fixed; left: 50%; bottom: 96px; z-index: 80; transform: translate(-50%, 20px); max-width: min(92vw, 420px); padding: 13px 20px; border-radius: 999px; background: rgba(29, 29, 31, .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; font-size: 15px; font-weight: 500; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { #toast { bottom: 30px; } }

@media (prefers-reduced-motion: reduce) {
  .blobs i, .grad { animation: none; }
  .card, .mock, .btn { transition: none; }
}

.preview-head .btn { flex: none; white-space: nowrap; }
.tabs button { white-space: nowrap; }


/* ---------- Stickers (bandeja y herramientas) ---------- */
.dock { background: #fff; border-radius: 24px; padding: 12px 12px 10px; margin-bottom: 14px; box-shadow: 0 2px 14px rgba(0, 0, 0, .05); }
.dock-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 4px 8px; }
.dock-title span { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); }
.dock-title small { font-size: 13px; color: var(--gray); text-align: right; }
.tray { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.tray::-webkit-scrollbar { display: none; }
.tray button { flex: none; width: 48px; height: 48px; border: 0; border-radius: 15px; background: var(--fill); font-size: 26px; line-height: 1; cursor: pointer; transition: transform .25s var(--spring), background .2s; }
.tray button:hover { background: #E8E8ED; }
.tray button:active { transform: scale(.85); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; padding: 10px 2px 0; border-top: 1px solid var(--line); }
.tools[hidden] { display: none; }
.tools .btn { min-height: 38px; min-width: 44px; padding: 0 14px; font-size: 18px; }
.tools .btn-danger { font-size: 15px; margin-left: auto; }

/* ---------- Hoja de publicación (pago) ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: sheet-fade .25s ease; }
.sheet { width: min(520px, 100%); max-height: 92vh; overflow-y: auto; background: #fff; border-radius: 30px 30px 0 0; padding: 26px 22px calc(26px + env(safe-area-inset-bottom)); animation: sheet-up .5s var(--spring); }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 30px; } }
@keyframes sheet-fade { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 28px; font-weight: 800; letter-spacing: -.035em; }
.sheet .sub { margin-top: 4px; color: var(--gray); font-size: 16px; }
.price { margin: 18px 0 6px; padding: 16px 18px; border-radius: 20px; background: var(--fill); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.price span { color: var(--gray); font-size: 15px; }
.price strong { font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
.price em { font-style: normal; font-size: 15px; color: var(--gray); }
.psteps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 14px; counter-reset: p; }
.psteps li { counter-increment: p; position: relative; padding: 0 0 0 46px; }
.psteps li::before { content: counter(p); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 700; font-size: 15px; }
.psteps strong { display: block; font-size: 17px; }
.psteps p { margin-top: 2px; font-size: 15px; color: var(--gray); line-height: 1.4; }
.psteps .btn { margin-top: 10px; }
.sheet .notice { font-size: 14px; }
.sheet-close { margin-top: 18px; }


/* ---------- Enlace único: invitado y "gracias" ---------- */
.guest { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: var(--gbg, #111); }
.guest-card { width: 100%; max-width: 440px; }
.guest-cta { display: block; width: 100%; max-width: 440px; padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; font-size: 15px; font-weight: 600; color: #fff; text-decoration: none; background: #1D1D1F; }
.guest-msg { margin: auto; padding: 40px 28px; text-align: center; color: #fff; max-width: 360px; }
.guest-msg h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
.guest-msg p { margin-top: 10px; opacity: .8; }
.thanks { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #fff; position: relative; overflow: hidden; }
.thanks .blobs i { opacity: .35; }
.thanks-card { position: relative; width: min(460px, 100%); background: #fff; border-radius: 30px; padding: 30px 24px; text-align: center; box-shadow: 0 20px 60px -20px rgba(0,0,0,.25); }
.thanks-card h1 { font-size: 30px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.thanks-card p { margin-top: 10px; color: var(--gray); }
.spin { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--fill); border-top-color: var(--pink); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.linkbox { margin: 18px 0 6px; padding: 14px 16px; border-radius: 16px; background: var(--fill); font-size: 15px; font-weight: 600; word-break: break-all; text-align: left; user-select: all; }
.btn-col { display: grid; gap: 10px; margin-top: 14px; }
.btn-wa { background: #25D366; color: #052E16; }
.sheet .linkbox { margin-top: 14px; }
.fine { font-size: 13px; color: var(--gray); margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }


/* ---------- Fondos y stickers ilustrados en el editor ---------- */
.bgchips { display: flex; flex-wrap: wrap; gap: 8px; }
.tray button.art { padding: 4px; }
.tray button.art svg, .tray button.art img { display: block; width: 36px; height: 36px; object-fit: contain; }

.dot.custom { position: relative; }
.dot.custom input { position: absolute; inset: 0 0 18px 0; width: 100%; height: calc(100% - 18px); opacity: 0; cursor: pointer; }

/* Álbum: casilla al publicar y caja de enlace */
.albopt { display: flex; align-items: flex-start; gap: 12px; margin: 14px 0 4px; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
.albopt:has(input:checked) { border-color: var(--pink); background: #fff5f9; }
.albopt input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--pink); }

.alb-error { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: #fde8e8; color: #9b1c1c; font-size: 14px; }
.alb-check { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 28px; font-weight: 800; }
.alb-ok h3 { margin: 0; font-size: 22px; color: var(--ink); }
.alb-ok p { margin: 0; color: var(--muted); }
.alb-live { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.alb-dot { width: 9px; height: 9px; border-radius: 50%; background: #2fbf5f; animation: alb-blink 1.6s ease-in-out infinite; }
.alb-live.off .alb-dot { background: #e0a21a; animation: none; }
@keyframes alb-blink { 50% { opacity: .35; } }
.alb-wall { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; padding: 6px 2px; }
.alb-pol { margin: 0; padding: 8px 8px 12px; background: #fff; color: #2b2b2b; border-radius: 3px; text-align: left; box-shadow: 0 6px 16px rgba(0,0,0,.22); transform: rotate(var(--tilt, 0deg)); }
.alb-pol.is-new { animation: alb-pop .6s var(--spring, ease) both; }
@keyframes alb-pop { from { opacity: 0; transform: scale(.7) rotate(0deg); } }
.alb-pol-btn { display: block; width: 100%; padding: 0; border: 0; background: #eee; cursor: zoom-in; }
.alb-pol-btn img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.alb-pol figcaption { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; font-size: 12px; line-height: 1.3; }
.alb-n { font-weight: 700; font-size: 13px; }
.alb-d { overflow-wrap: anywhere; }
.alb-t { font-size: 10px; color: #8a8a8a; }
.alb-empty { margin: 8px 0; padding: 24px 12px; text-align: center; color: var(--muted); }
.alb-empty h3 { margin: 6px 0 4px; font-size: 18px; color: var(--ink); }
.alb-empty p { margin: 0; font-size: 14px; }
.alb-frame { display: grid; place-items: center; width: 84px; height: 96px; margin: 0 auto; font-size: 34px; background: #fff; border-radius: 3px; box-shadow: 0 6px 14px rgba(0,0,0,.2); opacity: .9; }
.alb-lb { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.82); }
.alb-lb[hidden] { display: none; }
.alb-lb-card { position: relative; width: min(440px, 100%); max-height: 100%; overflow-y: auto; padding: 12px; background: #fff; color: #2b2b2b; border-radius: 10px; text-align: left; }
.alb-lb-card img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: #eee; }
.alb-lb-x { position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
.alb-lb-txt { display: flex; flex-direction: column; gap: 2px; padding: 10px 2px 4px; }
.alb-lb-n { font-weight: 700; }

.alb-lb-nav button:disabled { opacity: .4; }
body.no-scroll { overflow: hidden; }

  function resolvePalette(tpl, id) {
    id = String(id || '');
    const bgs = tpl.backgrounds || [];
    let p = tpl.palettes.find((x) => x.id === id);
    if (p) return { palette: p, bg: bgs[0] || null };
    const cm = /^c([0-9a-f]{6})(?:-(.+))?$/.exec(id);

      const pal = derivePalette('c' + cm[1], 'Mi color', hex2hsl(hex).h, tpl.tone === 'dark', hex);
      return { palette: pal, bg: bgs.find((b) => b.id === cm[2]) || bgs[0] || null };
    }
    for (let i = 0; i < tpl.palettes.length; i++) {
      const pal = tpl.palettes[i];
      if (id.indexOf(pal.id + '-') === 0) {
        const bg = bgs.find((b) => b.id === id.slice(pal.id.length + 1));
        if (bg) return { palette: pal, bg };
      }
    }
    return { palette: tpl.palettes[0], bg: bgs[0] || null };
  }
  function composePalette(tpl, paletteId, bgId) {
    return tpl.backgrounds && tpl.backgrounds.length && bgId ? paletteId + '-' + bgId : paletteId;
  }

  global.TapNova = global.TapNova || {};
  global.TapNova.Catalog = {
    resolvePalette,
    composePalette,
    CATEGORIES,
    TEMPLATES,
    FIELDS,
    getTemplate,
    getCategory,
    resolveFields,
    stickerSet
  };

    if (String(C.supabaseKey).indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + C.supabaseKey;
    if (withBody) h['Content-Type'] = 'application/json';

  function pack(inv) {

  }

  async function call(fn, body) {

    if (!r.ok) { const err = new Error((data && data.error) || 'error'); err.status = r.status; throw err; }

  <script>
/*
 * render.js — Convierte (plantilla + datos + stickers de una invitación) en HTML
 * y le da vida (confeti, globos que se revientan, stickers, cuenta regresiva).
 *
 * Una sola función de dibujo sirve para TODAS las plantillas: lo que cambia
 * entre una plantilla y otra son sus textos, paletas, adornos y estilos CSS
 * (css/templates.css), no el código.
 *

 * HTML, para que nadie pueda inyectar código en una invitación.
 */
(function (global) {
  'use strict';

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function multiline(v) {
    return esc(v).replace(/\n/g, '<br>');
  }

  function clamp(n, min, max) {
    return Math.min(max, Math.max(min, n));
  }

  function parseDateTime(dateStr, timeStr) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) return null;
    const p = dateStr.split('-').map(Number);
    let hh = 0, mm = 0;
    if (/^\d{2}:\d{2}$/.test(timeStr || '')) {
      const t = timeStr.split(':').map(Number);
      hh = t[0]; mm = t[1];
    }
    const dt = new Date(p[0], p[1] - 1, p[2], hh, mm, 0);
    return isNaN(dt.getTime()) ? null : dt;
  }

  function formatDate(dateStr) {
    const dt = parseDateTime(dateStr, '');
    if (!dt) return '';
    const s = dt.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function formatTime(timeStr) {
    if (!/^\d{2}:\d{2}$/.test(timeStr || '')) return '';
    const t = timeStr.split(':').map(Number);
    const h12 = t[0] % 12 || 12;
    return h12 + ':' + String(t[1]).padStart(2, '0') + (t[0] < 12 ? ' a. m.' : ' p. m.');
  }

  // Solo enlaces http/https. Acepta que la persona escriba "maps.app.goo.gl/..." sin https.
  function safeUrl(raw) {
    let u = String(raw || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try {
      const url = new URL(u);
      if ((url.protocol === 'http:' || url.protocol === 'https:') && url.hostname.indexOf('.') > 0) {
        return url.href;
      }
    } catch (e) { /* inválido */ }
    return '';
  }

  // Números de 10 dígitos se toman como México (+52).
  function whatsappLink(phone, text) {
    let digits = String(phone || '').replace(/\D/g, '');
    if (digits.length === 10) digits = '52' + digits;
    if (digits.length < 11 || digits.length > 15) return '';
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text || '');
  }

  function mapsLink(data) {
    const direct = safeUrl(data.mapsUrl);
    if (direct) return direct;
    const q = [data.venue, data.address].filter(Boolean).join(' ').trim();
    return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
  }

  function countdownParts(targetMs, nowMs) {
    const diff = targetMs - nowMs;
    if (diff <= 0) return { done: true, d: 0, h: 0, m: 0, s: 0 };
    const s = Math.floor(diff / 1000);

      done: false,
      d: Math.floor(s / 86400),
      h: Math.floor((s % 86400) / 3600),
      m: Math.floor((s % 3600) / 60),
      s: s % 60
    };
  }

  const pad = (n) => String(n).padStart(2, '0');

  const PLACEHOLDER_SVG =
    '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="17" fill="currentColor"/>' +
    '<path d="M16 92c2-22 16-34 34-34s32 12 34 34z" fill="currentColor"/></svg>';

  // Posiciones (x%, y%, tamaño px, duración s, retraso s) de los adornos flotantes.
  const FLOAT_SLOTS = [
    [5, 7, 34, 5.2, -1.2], [82, 5, 38, 6.1, -3.1], [4, 33, 30, 5.6, -2.2], [86, 31, 34, 4.8, -0.6],
    [6, 58, 36, 6.4, -4.0], [84, 56, 30, 5.0, -1.8], [14, 82, 32, 5.8, -2.9], [76, 84, 36, 5.4, -3.6]
  ];

  // Stickers: cada uno es { id, e (emoji), x, y (% de la portada), s (tamaño px), r (giro °) }.
  function stickersHtml(list) {
    if (!Array.isArray(list) || !list.length) return '';

      if (!st || typeof st.e !== 'string' || !st.e) return '';
      const x = clamp(Number(st.x) || 0, -5, 105);
      const y = clamp(Number(st.y) || 0, -5, 105);
      const s = clamp(Number(st.s) || 56, 24, 160);
      const r = clamp(Number(st.r) || 0, -360, 360);

  // Textos fijos que ahora también se pueden editar (etiqueta superior y botones).
  // Si la persona nunca los tocó, se usa el de la plantilla; si borra la etiqueta, se oculta.
  function kickerHtml(tpl, d) {
    const k = d.kicker === undefined || d.kicker === null ? tpl.kicker : String(d.kicker);
    return k.trim() ? '<p class="inv-kicker">' + esc(k) + '</p>' : '';
  }
  function txt(d, key, def) {
    const v = d && typeof d[key] === 'string' ? d[key].trim() : '';
    return v || def;
  }

  // Nombre: normal, o "letras recortadas" (cada letra con su propio estilo).
  function namesHtml(tpl, d) {
    const raw = d.names || 'Tu nombre aquí';
    if (tpl.nameStyle === 'ransom') {
      const letters = Array.from(String(raw)).slice(0, 24).map((ch) =>
        ch === ' ' ? '<span class="sp" aria-hidden="true"></span>' : '<span class="l" aria-hidden="true">' + esc(ch) + '</span>'
      ).join('');
      return '<h1 class="inv-names" aria-label="' + esc(raw) + '">' + letters + '</h1>';
    }
    if (tpl.nameStyle === 'plate') {
      return '<h1 class="inv-names"><span class="plate">' + esc(raw) + '</span></h1>';
    }
    return '<h1 class="inv-names">' + esc(raw) + '</h1>';
  }

  // ---------- Secciones ----------
  // Para sumar una sección nueva (música, galería...) se agrega aquí y se
  // nombra en la lista "sections" de la plantilla que la quiera usar.
  const SECTIONS = {
    hero(tpl, d, ctx, inv) {
      const hasPhoto = typeof d.photo === 'string' && d.photo.indexOf('data:image/') === 0;
      let photo = '';
      if (hasPhoto) {
        photo = '<div class="inv-photo"><img src="' + esc(d.photo) + '" alt="Fotografía de ' + esc(d.names) + '"></div>';
      } else if (!tpl.photoOptional) {
        photo = '<div class="inv-photo"><div class="inv-photo-empty">' + PLACEHOLDER_SVG + '</div></div>';
      }
      const floaters = (tpl.floaters || []).slice(0, FLOAT_SLOTS.length).map((emoji, i) => {
        const s = FLOAT_SLOTS[i];

      }).join('');

      return (
        '<header class="inv-hero">' +
        '<div class="inv-deco" aria-hidden="true"></div>' +
        kickerHtml(tpl, d) +
        photo +
        namesHtml(tpl, d) +
        (d.motive ? '<p class="inv-motive">' + esc(d.motive) + '</p>' : '') +
        (age ? '<div class="inv-age">' + esc(age.slice(0, 3)) + '</div>' : '') +

        '</header>'

    },

    message(tpl, d) {
      if (!d.message || !d.message.trim()) return '';
      return '<section class="inv-block inv-message reveal"><p>' + multiline(d.message) + '</p></section>';
    },

    details(tpl, d) {
      const rows = [];
      const date = formatDate(d.date);
      const time = formatTime(d.time);
      if (date) rows.push(['Fecha', date, '📅']);
      if (time) rows.push(['Hora', time, '🕒']);
      if (d.venue) rows.push(['Lugar', d.venue, '📍']);
      if (!rows.length) return '';
      return (
        '<section class="inv-block inv-details">' +
        rows.map((r, i) =>
          '<div class="inv-detail reveal" style="--i:' + i + '"><span class="inv-ico" aria-hidden="true">' + r[2] + '</span>' +
          '<div><span class="inv-label">' + r[0] + '</span><strong>' + esc(r[1]) + '</strong></div></div>'
        ).join('') +
        '</section>'

    },

    countdown(tpl, d) {
      const dt = parseDateTime(d.date, d.time);
      if (!dt) return '';
      const p = countdownParts(dt.getTime(), Date.now());
      const cell = (k, v, label) => '<div><b data-u="' + k + '">' + pad(v) + '</b><span>' + label + '</span></div>';

        '<section class="inv-block inv-countdown reveal" data-countdown="' + dt.getTime() + '">' +
        '<p class="inv-label">' + esc(txt(d, 'countLabel', 'Faltan')) + '</p>' +
        '<div class="inv-count">' +

      // se muestra el botón apagado para que se entienda qué falta.
      if (ctx && ctx.preview) {
        return '<section class="inv-block inv-rsvp reveal"><span class="inv-btn inv-btn-main is-disabled">' + esc(txt(d, 'btnText', 'Confirmar asistencia')) + '</span></section>';
      }

    }
  };

  // ---------- Álbum de fotos (extra de pago) ----------
  // "albumbtn": botón en la invitación que lleva al álbum. "album": la pantalla del álbum (se conecta en album.js).
  SECTIONS.albumbtn = function (tpl, d, ctx) {
    if (!ctx || !ctx.albumSlug) return '';
    return '<section class="inv-block inv-album-cta reveal"><p class="inv-label">Álbum de fotos en vivo</p>' +
      '<a class="inv-btn" href="#/a/' + esc(ctx.albumSlug) + '">📷 Subir y ver fotos</a></section>';
  };
  SECTIONS.album = function () {
    return '<section class="inv-block alb">' +
      '<div class="alb-card" id="subir"><h2 class="alb-h">Comparte tu foto</h2>' +
      '<form class="alb-form" novalidate>' +
      '<p class="alb-trap" aria-hidden="true"><label>No llenar <input id="albTrap" tabindex="-1" autocomplete="off"></label></p>' +
      '<div class="alb-step1"><button type="button" class="inv-btn" id="albPick">Elegir una foto</button>' +
      '<button type="button" class="inv-btn alb-ghost" id="albShoot">Tomar una foto ahora</button><p class="alb-fine">JPG, PNG o WebP</p></div>' +
      '<input type="file" id="albFile" accept="image/jpeg,image/png,image/webp" hidden><input type="file" id="albCam" accept="image/*" capture="environment" hidden>' +
      '<div class="alb-step2" hidden><div class="alb-preview"><img class="alb-prev-img" alt="Vista previa de tu foto"><span>Así se verá en el álbum</span></div>' +
      '<label class="alb-field"><span>Tu nombre</span><input type="text" id="albName" maxlength="60" placeholder="Ej. Tía Lupita" autocomplete="name"></label>' +
      '<label class="alb-field"><span>Dedicatoria (opcional)</span><textarea id="albMsg" rows="3" maxlength="250" placeholder="Unas palabras para el festejado…"></textarea><small class="alb-count">0 / 250</small></label>' +
      '<div class="alb-btns"><button type="submit" class="inv-btn" id="albSend">Enviar foto</button>' +
      '<button type="button" class="inv-btn alb-ghost" id="albOther">Elegir otra foto</button>' +
      '<button type="button" class="alb-link" id="albCancel">Cancelar</button></div></div>' +
      '<p class="alb-error" role="alert" hidden></p></form>' +
      '<div class="alb-ok" role="status" hidden><div class="alb-check" aria-hidden="true">✓</div><h3>¡Gracias, <span class="alb-ok-name"></span>!</h3>' +
      '<p>Tu foto ya está en el álbum. ¡Míralo aquí abajo!</p><button type="button" class="inv-btn" id="albAgain">Subir otra foto</button></div></div>' +
      '<h2 class="alb-h alb-h2">El álbum de la fiesta</h2>' +
      '<p class="alb-live" hidden><span class="alb-dot" aria-hidden="true"></span><span>En vivo</span></p>' +
      '<div class="alb-wall"></div>' +
      '<div class="alb-empty" hidden><div class="alb-frame" aria-hidden="true">📷</div><h3>El álbum aún está vacío</h3><p>Las fotos aparecerán aquí en cuanto se suban.</p></div>' +
      '<div class="alb-lb" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden><div class="alb-lb-card">' +
      '<button type="button" class="alb-lb-x" aria-label="Cerrar">×</button><img alt="">' +
      '<div class="alb-lb-txt"><span class="alb-lb-n"></span><span class="alb-lb-d"></span><time class="alb-lb-t"></time></div>' +
      '<div class="alb-lb-nav"><button type="button" class="alb-prev">← Anterior</button><span class="alb-lb-pos"></span><button type="button" class="alb-next">Siguiente →</button></div>' +
      '</div></div></section>';
  };

  function getPalette(tpl, paletteId) {
    return global.TapNova.Catalog.resolvePalette(tpl, paletteId);
  }

  function render(tpl, inv, ctx) {
    ctx = ctx || {};
    const rp = getPalette(tpl, inv.paletteId);
    const palette = rp.palette;
    const style = Object.keys(palette.vars).map((k) => k + ':' + palette.vars[k]).join(';') + (rp.bg ? ';--scrap-bg:' + rp.bg.css : '');
    const body = tpl.sections.map((name) => (SECTIONS[name] ? SECTIONS[name](tpl, inv.data || {}, ctx, inv) : '')).join('');
    return (
      '<article class="inv tpl-' + esc(tpl.layout) + (tpl.variant ? ' v-' + esc(tpl.variant) : '') + (ctx.album ? ' is-album' : '') + '" style="' + esc(style) + '">' +
      body +
      '<footer class="inv-foot">Creada con Tap Nova</footer>' +
      '</article>'
    );
  }

  /* ---------- Vida: confeti, globos, stickers, animaciones ---------- */
  function prefersReducedMotion() {
    return !!(global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function popColors(inv) {
    const cs = global.getComputedStyle(inv);
    const list = ['--accent', '--accent-2', '--pop-1', '--pop-2']
      .map((v) => cs.getPropertyValue(v).trim()).filter(Boolean);
    return list.length ? list : ['#FF4F8B', '#FFC83D', '#2FB8F0', '#4CCB6A'];
  }

  // Lanza confeti desde el punto (x, y) dentro de la invitación.
  function burst(inv, x, y, count) {

    const colors = popColors(inv);
    const n = count || 26;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'inv-conf';
      const w = 6 + Math.random() * 7;
      p.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + (w * (Math.random() > 0.5 ? 1 : 0.5)) +
        'px;background:' + colors[i % colors.length] + ';' + (Math.random() > 0.6 ? 'border-radius:50%' : '');
      inv.appendChild(p);
      const ang = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 110;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist;
      const anim = p.animate([
        { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + (dy + 70) + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg) scale(.5)', opacity: 0 }
      ], { duration: 800 + Math.random() * 600, easing: 'cubic-bezier(.15,.8,.3,1)' });
      anim.onfinish = () => p.remove();
    }
  }

  // Pone a andar la invitación dentro de "root". Devuelve una función para detenerla.
  //   opts.live = true → con animaciones de entrada (al abrir la invitación)
  //   opts.edit = { selectedId, onSelect(id), onMove(id, x, y) } → los stickers se pueden arrastrar
  function mount(root, opts) {
    opts = opts || {};
    const inv = root.querySelector('.inv');
    if (!inv) return function () {};
    const reduce = prefersReducedMotion();
    let io = null;

    // Entrada suave de cada bloque al hacer scroll.
    if (opts.live) {
      inv.classList.add('inv-live');
      const items = Array.prototype.slice.call(inv.querySelectorAll('.reveal'));
      if ('IntersectionObserver' in global && !reduce) {
        io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
          });
        }, { threshold: 0.12 });
        items.forEach((el) => io.observe(el));
      } else {
        items.forEach((el) => el.classList.add('in'));
      }
      if (!reduce) setTimeout(() => { if (inv.isConnected) burst(inv, inv.clientWidth / 2, 190); }, 450);
    }

    // Arrastrar stickers (solo en el editor).
    const E = opts.edit;
    if (E) {
      inv.classList.add('inv-edit');

/*
 * app.js — Pantallas de la plataforma: galería de plantillas, editor y pedido.
 *
 * Rutas (se leen del "#" de la dirección, así funcionan en cualquier hosting estático):
 *   #/                 → galería (inicio)
 *   #/nueva/<plantilla>→ editor con una invitación nueva (aún sin guardar)
 *   #/editar/<id>      → editor con un borrador guardado
 *   #/importar         → (solo para el estudio) abrir el archivo de pedido de un cliente
 *   #/i/<enlace>       → invitación pública que ven los invitados
 *   #/a/<enlace>       → álbum de fotos en vivo de esa invitación (extra de pago)
 *   #/gracias/<id>     → pantalla a la que regresa Mercado Pago después de pagar
 */

  'use strict';

  const Storage = window.TapNova.Storage;

  const BASE_TITLE = 'Tap Nova Invitaciones — Crea tu invitación digital';

  let galleryFilter = 'todas';

    let stopThumbs = null;
    let cardObserver = null;
    function paintGrid() {
      if (stopThumbs) stopThumbs();
      if (cardObserver) cardObserver.disconnect();
      const grid = document.getElementById('grid');
      const items = Catalog.TEMPLATES.filter((t) => galleryFilter === 'todas' || t.category === galleryFilter);
      grid.innerHTML = items.length
        ? items.map(templateCard).join('')
        : '<p class="empty">Aún no hay plantillas en esta categoría. ¡Pronto habrá más!</p>';
      stopThumbs = fitThumbs(app);
      // Las tarjetas aparecen suavemente al entrar en pantalla.
      const cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
      if ('IntersectionObserver' in window) {
        cards.forEach((c) => c.classList.add('pre'));
        cardObserver = new IntersectionObserver((es) => {
          es.forEach((e) => { if (e.isIntersecting) { e.target.classList.remove('pre'); cardObserver.unobserve(e.target); } });
        }, { threshold: 0.08 });
        cards.forEach((c) => cardObserver.observe(c));
      }
    }
    paintGrid();
    leave = () => { if (stopThumbs) stopThumbs(); if (cardObserver) cardObserver.disconnect(); };

    app.onclick = function (e) {
      const chip = e.target.closest('[data-filter]');
      if (chip) {
        galleryFilter = chip.getAttribute('data-filter');
        app.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
        paintGrid();
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      const id = btn.getAttribute('data-id');
      if (act === 'scroll') {
        document.getElementById('plantillas-sec').scrollIntoView({ behavior: 'smooth' });
      } else if (act === 'dup') {
        if (Storage.duplicate(id)) { toast('Copia creada.'); rerender(); }
        else toast('No se pudo duplicar: no hay espacio en este dispositivo.');
      } else if (act === 'del') {
        if (window.confirm('¿Eliminar este borrador? No se puede deshacer.')) {
          Storage.remove(id);
          toast('Borrador eliminado.');
          rerender();
        }
      }
    };
  }

  function rerender() {
    const y = window.scrollY;
    if (leave) { leave(); leave = null; }
    showGallery();
    window.scrollTo(0, y);
  }

  // Las miniaturas son la propia plantilla dibujada a 390px y reducida.
  function fitThumbs(root) {
    function scale(t) {
      const inner = t.querySelector('.thumb-inner');
      if (inner && t.clientWidth) inner.style.transform = 'scale(' + (t.clientWidth / 390) + ')';
    }
    const ro = 'ResizeObserver' in window ? new ResizeObserver((es) => es.forEach((e) => scale(e.target))) : null;
    root.querySelectorAll('.thumb').forEach((t) => { scale(t); if (ro) ro.observe(t); });
    return function () { if (ro) ro.disconnect(); };
  }

  function fieldHtml(f, value) {
    const id = 'f-' + f.key;

    const max = f.max ? ' maxlength="' + f.max + '"' : '';
    const hint = f.hint ? '<small id="' + id + '-h">' + esc(f.hint) + '</small>' : '';
    const err = (f.key === 'mapsUrl' || f.key === 'whatsapp') ? '<small class="err" data-err="' + f.key + '" role="alert"></small>' : '';
    const desc = f.hint ? ' aria-describedby="' + id + '-h"' : '';
    const label = '<label for="' + id + '">' + esc(f.label) + '</label>';

    if (f.type === 'image') {
      return (
        '<div class="field"><span class="field-label">' + esc(f.label) + '</span>' +

        '<div class="photo-thumb" id="photoThumb"></div>' +

        '</div><small>Se reduce automáticamente para que tu invitación cargue rápido.</small></div>'
      );
    }
    if (f.type === 'textarea') {
      return '<div class="field">' + label + '<textarea id="' + id + '" name="' + f.key + '" rows="' + (f.rows || 3) + '"' + ph + max + desc + '>' + esc(value) + '</textarea>' + hint + err + '</div>';
    }
    const type = { text: 'text', url: 'text', tel: 'tel', date: 'date', time: 'time' }[f.type] || 'text';
    const mode = f.type === 'url' ? ' inputmode="url" autocapitalize="off" spellcheck="false"' : f.type === 'tel' ? ' inputmode="tel"' : '';
    return '<div class="field">' + label + '<input id="' + id + '" name="' + f.key + '" type="' + type + '"' + mode + ph + max + desc + ' value="' + esc(value) + '">' + hint + err + '</div>';
  }

  function groupHtml(title, fields, data) {
    if (!fields.length) return '';
    const out = [];
    for (let i = 0; i < fields.length; i++) {
      const f = fields[i];
      const next = fields[i + 1];
      if (f.key === 'date' && next && next.key === 'time') {
        out.push('<div class="row-2">' + fieldHtml(f, data.date) + fieldHtml(next, data.time) + '</div>');
        i++;
      } else {
        out.push(fieldHtml(f, data[f.key]));
      }
    }
    return '<section class="group"><h3>' + esc(title) + '</h3>' + out.join('') + '</section>';
  }

  function fieldsHtml(fields, data) {
    const used = new Set();
    let html = GROUPS.map((g) => {
      const list = fields.filter((f) => g.keys.indexOf(f.key) >= 0);
      list.forEach((f) => used.add(f.key));
      return groupHtml(g.title, list, data);
    }).join('');
    const rest = fields.filter((f) => !used.has(f.key));
    if (rest.length) html += groupHtml('Más detalles', rest, data);
    return html;
  }

  // Reduce la foto a 900px y la guarda como JPG para que quepa en el dispositivo.
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('read'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('img'));
        img.onload = () => {
          const s = Math.min(1, 900 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * s));
          c.height = Math.max(1, Math.round(img.height * s));
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  }

  function openCloudPublish(tpl, inv, saveNow) {
    const names = (inv.data && inv.data.names) || 'Sin nombre';
    const pub = inv.publication;
    const price = Config.price;
    const priceHtml = '<div class="price"><span>Invitación con enlace único</span><div>' +
      (price != null && price !== '' ? '<strong>$' + esc(price) + '</strong> <em>' + esc(Config.currency || 'MXN') + '</em>' : '<em>El monto se muestra al pagar</em>') + '</div></div>';

    if (pub && pub.status === 'published' && pub.slug) {
      const url = inviteUrl(pub.slug);
      sheetShell(
        '<h2 id="sheetTitle">Tu invitación está publicada</h2><p class="sub">' + esc(names) + '</p>' +
        '<div class="linkbox">' + esc(url) + '</div>' + shareButtons(url, names) +
        (pub.album ? albumBox(pub.slug, names) : '') +
        '<p class="fine">¿Cambiaste algo? Actualiza el enlace sin volver a pagar (solo desde este teléfono).</p>' +
        '<div class="btn-col"><button class="btn btn-dark" type="button" id="updBtn">Actualizar mi invitación</button>' +
        '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Ver como invitado</a></div>' +
        '<button class="btn btn-block sheet-close" type="button" id="sheetClose">Seguir editando</button>');
      bindCopy(sheetEl);
      sheetEl.querySelector('#updBtn').addEventListener('click', async (e) => {
        const b = e.currentTarget; b.disabled = true; b.textContent = 'Actualizando…';
        try { await Cloud.update(inv); toast('Listo, tu invitación se actualizó.'); closeSheet(); }
        catch (err) { b.disabled = false; b.textContent = 'Actualizar mi invitación'; toast(err.status === 403 ? 'Solo se puede actualizar desde el teléfono donde la publicaste.' : 'No se pudo actualizar. Intenta de nuevo.'); }
      });
      return;
    }

    const pa = Config.priceAlbum;
    const albumOpt = pa ? '<label class="albopt"><input type="checkbox" id="albChk"><span><strong>📷 Agregar álbum de fotos en vivo</strong> <em>$' + esc(pa) + ' en total</em>' +
      '<small>Tus invitados suben fotos y dedicatorias y aparecen al instante, con el mismo diseño de tu invitación. Disponible hasta 60 días después del evento.</small></span></label>' : '';
    sheetShell(
      '<h2 id="sheetTitle">Publica tu invitación</h2><p class="sub">' + esc(tpl.name) + ' · ' + esc(names) + '</p>' + priceHtml +
      albumOpt +
      '<ol class="psteps"><li><strong>Paga seguro con Mercado Pago</strong><p>Tarjeta, saldo, OXXO o transferencia.</p></li>' +
      '<li><strong>Recibe tu enlace al instante</strong><p>Al terminar el pago, tu invitación se publica sola. Sin esperar a nadie.</p></li>' +
      '<li><strong>Compártela</strong><p>Por WhatsApp, Facebook o donde quieras. Puedes corregirla después sin costo.</p></li></ol>' +
      '<button class="btn btn-primary btn-block" type="button" id="payBtn">Publicar</button>' +
      '<p class="fine" id="payMsg" role="status"></p>' +
      '<button class="btn btn-block sheet-close" type="button" id="sheetClose">Seguir editando</button>');
    const chk = sheetEl.querySelector('#albChk');
    if (chk) chk.addEventListener('change', () => {
      const v = sheetEl.querySelector('.price strong');
      if (v) v.textContent = '$' + (chk.checked ? pa : price);
      sheetEl.querySelector('.price span').textContent = chk.checked ? 'Invitación + álbum de fotos' : 'Invitación con enlace único';
    });
    sheetEl.querySelector('#payBtn').addEventListener('click', async (e) => {
      const b = e.currentTarget, msg = sheetEl.querySelector('#payMsg');
      const wantAlbum = !!(chk && chk.checked);
      b.disabled = true; b.textContent = 'Preparando…'; msg.textContent = '';
      Cloud.track(wantAlbum ? 'clic_pagar_album' : 'clic_pagar', tpl.id);
      try {
        const r = await Cloud.startCheckout(inv, wantAlbum);
        if (r.status === 'published') {
          inv.publication = Object.assign({}, inv.publication, { status: 'published', slug: r.slug, album: !!r.album }, r.token ? { token: r.token } : {});
          Storage.save(inv); closeSheet();
          if (r.free) { Cloud.track('publicada_gratis', tpl.id); toast('¡Publicada gratis! 🎉'); openCloudPublish(tpl, inv, saveNow); }
          else toast('Esta invitación ya estaba publicada.');
          return;
        }
        inv.publication = { status: 'pending', token: r.token, album: !!r.album };
        const res = Storage.save(inv);
        if (!res.ok) { throw new Error('storage'); }
        location.href = r.checkoutUrl;
      } catch (err) {
        b.disabled = false; b.textContent = 'Publicar';
        msg.textContent = err.message === 'storage' ? 'No hay espacio en este teléfono para guardar tu clave de edición. Libera espacio e intenta de nuevo.' : 'No pudimos iniciar el pago. Revisa tu internet e intenta de nuevo.';
      }
    });
  }

  function showThanks(id) {
    document.title = 'Gracias — Tap Nova';
    const inv = Storage.get(id);
    app.innerHTML = '<section class="thanks"><div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
      '<div class="thanks-card" id="thanks"><div class="spin" aria-hidden="true"></div><h1>Confirmando tu pago…</h1><p>Esto toma unos segundos. No cierres esta pantalla.</p></div></section>';
    const box = app.querySelector('#thanks');
    let stopped = false, tries = 0;
    leave = () => { stopped = true; };
    const done = (row) => {
      const url = inviteUrl(row.slug);
      const names = (row.data && row.data.names) || 'Mi invitación';
      if (inv) { inv.publication = Object.assign({}, inv.publication, { status: 'published', slug: row.slug, album: !!row.album }); Storage.save(inv); }
      box.innerHTML = '<h1>¡Tu invitación está lista! 🎉</h1><p>Este es tu enlace único. Compártelo con tus invitados.</p>' +
        '<div class="linkbox">' + esc(url) + '</div>' + shareButtons(url, names) +
        (row.album ? albumBox(row.slug, names) : '') +
        '<div class="btn-col"><a class="btn btn-dark" href="' + esc('#/i/' + row.slug) + '">Ver mi invitación</a><a class="btn" href="#/">Ir al inicio</a></div>' +
        '<p class="fine">Guarda este enlace. Si necesitas corregir algo, abre tu borrador en este mismo teléfono.</p>';
      bindCopy(box);
    };
    const tick = async () => {
      if (stopped) return;
      tries++;
      try { const row = await Cloud.getById(id); if (row && row.slug) { done(row); return; } } catch (e) { /* se reintenta */ }
      if (tries >= 40) {
        box.innerHTML = '<h1>Seguimos confirmando</h1><p>Si ya pagaste, tu invitación se publicará en unos minutos. Vuelve a abrir esta página en un rato.</p>' +
          '<div class="btn-col"><button class="btn btn-dark" type="button" id="retry">Revisar otra vez</button><a class="btn" href="#/">Ir al inicio</a></div>' +
          (Config.whatsapp ? '<p class="fine">¿Dudas? Escríbenos por WhatsApp al ' + esc(phoneLabel(Config.whatsapp)) + '.</p>' : '');
        const r = box.querySelector('#retry'); if (r) r.onclick = () => showThanks(id);
        return;
      }
      setTimeout(tick, 3000);
    };
    if (!Cloud || !Cloud.on()) { box.innerHTML = '<h1>Gracias</h1><p>Tu pago se está procesando.</p><a class="btn" href="#/">Ir al inicio</a>'; return; }
    tick();
  }

  async function showGuest(slug) {
    document.title = 'Estás invitado — Tap Nova';
    document.body.classList.add('is-guest');
    leave = () => { document.body.classList.remove('is-guest'); if (stopCount) stopCount(); };
    let stopCount = null;
    const msgScreen = (h, p) => { app.innerHTML = '<div class="guest"><div class="guest-msg"><h1>' + h + '</h1><p>' + p + '</p></div></div>'; };
    if (!Cloud || !Cloud.on()) return msgScreen('Invitación no disponible', 'Este enlace todavía no está activo.');
    app.innerHTML = '<div class="guest"><div class="guest-msg"><div class="spin" aria-hidden="true"></div><p>Abriendo invitación…</p></div></div>';
    let row = null;
    try { row = await Cloud.getBySlug(slug); }
    catch (e) { return msgScreen('Sin conexión', 'No pudimos abrir la invitación. Revisa tu internet e intenta de nuevo.'); }
    const tpl = row && Catalog.getTemplate(row.template_id);
    if (!row || !tpl) return msgScreen('Invitación no encontrada', 'Es posible que el enlace esté mal escrito o que la invitación ya haya vencido.');
    const inv = Storage.sanitize({ templateId: row.template_id, paletteId: row.palette_id, data: row.data, stickers: row.stickers });
    if (!inv) return msgScreen('Invitación no disponible', 'No pudimos mostrar esta invitación.');
    if (Cloud) Cloud.track('invitado_ve', slug);
    document.title = ((inv.data && inv.data.names) || 'Invitación') + ' — Estás invitado';
    app.innerHTML = '<div class="guest"><div class="guest-card" id="gRoot"></div>' +
      '<a class="guest-cta" href="' + esc(siteBase()) + '">Creada con Tap Nova · Crea la tuya</a></div>';
    const root = app.querySelector('#gRoot');
    const tplG = row.album ? Object.assign({}, tpl, { sections: tpl.sections.concat('albumbtn') }) : tpl;
    root.innerHTML = Render.render(tplG, inv, { preview: false, albumSlug: row.album ? slug : '' });
    stopCount = Render.mount(root, { live: true });
  }

  // Álbum de fotos en vivo: la misma plantilla de la invitación (encabezado, colores, fondo y textos) + subir/ver fotos.
  async function showAlbum(slug) {
    document.title = 'Álbum de fotos — Tap Nova';
    document.body.classList.add('is-guest');
    let stopAlbum = null;
    leave = () => { document.body.classList.remove('is-guest'); if (stopAlbum) stopAlbum(); };
    const msgScreen = (h, p) => { app.innerHTML = '<div class="guest"><div class="guest-msg"><h1>' + h + '</h1><p>' + p + '</p></div></div>'; };
    if (!Cloud || !Cloud.on()) return msgScreen('Álbum no disponible', 'Este enlace todavía no está activo.');
    app.innerHTML = '<div class="guest"><div class="guest-msg"><div class="spin" aria-hidden="true"></div><p>Abriendo álbum…</p></div></div>';
    let row = null;
    try { row = await Cloud.getBySlug(slug); }
    catch (e) { return msgScreen('Sin conexión', 'No pudimos abrir el álbum. Revisa tu internet e intenta de nuevo.'); }
    const tpl = row && Catalog.getTemplate(row.template_id);
    if (!row || !tpl || !row.album) return msgScreen('Álbum no encontrado', 'Es posible que el enlace esté mal escrito o que el álbum ya haya vencido.');
    const inv = Storage.sanitize({ templateId: row.template_id, paletteId: row.palette_id, data: Object.assign({}, row.data, { kicker: 'Álbum de fotos en vivo' }), stickers: row.stickers });
    if (!inv) return msgScreen('Álbum no disponible', 'No pudimos mostrar este álbum.');
    if (Cloud) Cloud.track('album_ve', slug);
    document.title = ((inv.data && inv.data.names) || 'Evento') + ' — Álbum de fotos';
    const tplA = Object.assign({}, tpl, { sections: ['hero', 'album'], photoOptional: true, floaters: [] });
    app.innerHTML = '<div class="guest"><div class="guest-card" id="aRoot"></div>' +
      '<a class="guest-cta" href="#/i/' + esc(slug) + '">Ver la invitación</a></div>';
    const root = app.querySelector('#aRoot');
    root.innerHTML = Render.render(tplA, inv, { preview: false, album: true });
    const stopRender = Render.mount(root, { live: true });
    const stopLive = window.TapNova.Album.mount(root, slug);
    stopAlbum = () => { stopLive(); if (stopRender) stopRender(); };
  }

  function multi(t) { return esc(t).replace(/\n/g, '<br>'); }

  async function sendOrder(tpl, inv, hasWa) {
    const names = (inv.data && inv.data.names) || 'mi invitación';
    const text = 'Hola, quiero publicar mi invitación "' + names + '" (' + tpl.name + ').';
    const slug = String(names).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'invitacion';
    const payload = JSON.stringify({ app: 'tapnova-invitaciones', v: 2, invitation: inv });
    const file = new File([payload], 'tapnova-' + slug + '.txt', { type: 'text/plain' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: text });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // la persona canceló
    }
    // Respaldo: se descarga el archivo y se abre WhatsApp para adjuntarlo.
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (hasWa) {
      window.open(Render.whatsappLink(Config.whatsapp, text + ' Te adjunto mi archivo de diseño.'), '_blank', 'noopener');
      toast('Se descargó tu diseño. Adjúntalo en el chat de WhatsApp.');
    } else {
      toast('Se descargó tu diseño. Envíalo por WhatsApp a Tap Nova.');
    }
  }

  function customHex(tpl, inv) {
    const m = /^c([0-9a-f]{6})/.exec(String(inv.paletteId || ''));
    return m ? '#' + m[1] : Catalog.resolvePalette(tpl, inv.paletteId).palette.vars['--accent'].toLowerCase().slice(0, 7);
  }

  function showEditor(tpl, inv, isNew) {
    document.title = 'Editando ' + tpl.name + ' — Tap Nova';
    document.body.classList.add('is-editor');
    const fields = Catalog.resolveFields(tpl);
    const textKeys = new Set(fields.filter((f) => f.type !== 'image').map((f) => f.key));
    const data = inv.data;
    if (!Array.isArray(inv.stickers)) inv.stickers = [];

    const dots = tpl.palettes.map((p) => {
      const v = p.vars;
      const c3 = v['--pop-1'] || v['--accent-2'];
      return '<button class="dot" type="button" role="radio" aria-checked="' + (p.id === Catalog.resolvePalette(tpl, inv.paletteId).palette.id) + '" data-palette="' + esc(p.id) + '">' +
        '<i style="background:conic-gradient(' + v['--accent'] + ' 0 33%,' + v['--accent-2'] + ' 0 66%,' + c3 + ' 0)"></i>' + esc(p.name) + '</button>';
    }).join('');

    const Art = window.TapNova.Art;
    const tray = Catalog.stickerSet(tpl).filter((e) => e.charAt(0) !== '@' || (Art && Art.has(e))).map((e) =>
      e.charAt(0) === '@'
        ? '<button type="button" class="art" data-add="' + esc(e) + '" aria-label="Agregar sticker ' + esc(Art.label(e)) + '">' + Art.svg(e) + '</button>'
        : '<button type="button" data-add="' + esc(e) + '" aria-label="Agregar sticker ' + esc(e) + '">' + esc(e) + '</button>'
    ).join('');
    const curBg = Catalog.resolvePalette(tpl, inv.paletteId).bg;
    const bgChips = (tpl.backgrounds || []).map((b) =>
      '<button class="chip-btn" type="button" data-bg="' + esc(b.id) + '" aria-pressed="' + (!!curBg && curBg.id === b.id) + '">' + esc(b.name) + '</button>'
    ).join('');

    app.innerHTML =
      '<div class="editor" data-tab="edit">' +
      '<div class="navbar"><div class="wrap">' +
      '<a class="nav-back" href="#/">‹ Plantillas</a>' +
      '<div class="nav-title"><strong>' + esc(tpl.name) + '</strong><small id="saveState"></small></div>' +
      '<button class="nav-save" type="button" id="saveBtn">Guardar</button>' +
      '</div></div>' +
      '<div class="editor-grid">' +
      '<form class="form" id="form" autocomplete="off" novalidate>' +
      fieldsHtml(fields, data) +
      '<section class="group"><h3>Colores</h3>' +
      '<div class="palettes" role="radiogroup" aria-label="Colores">' + dots +
      '<label class="dot custom" title="Elige cualquier color"><i style="background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7ff,#5856d6,#ff2d92,#ff3b30)"></i>Propio<input type="color" id="customColor" value="' + esc(customHex(tpl, inv)) + '" aria-label="Elegir color propio"></label>' +
      '</div></section>' +
      (bgChips ? '<section class="group"><h3>Fondo</h3><div class="bgchips" role="group" aria-label="Fondo">' + bgChips + '</div></section>' : '') +
      '<section class="group"><h3>Stickers</h3>' +
      '<p class="publish-note">Agrégalos desde la bandeja de la vista previa y arrástralos con el dedo para acomodarlos.</p></section>' +
      '<section class="group"><h3>Publicar</h3>' +
      '<div class="field"><button class="btn btn-primary btn-block" type="button" id="publishBtn">Publicar y compartir</button></div>' +
      '<p class="publish-note">Tu diseño se guarda como borrador en este dispositivo. Al publicar, pagas y te entregamos tu enlace único.</p></section>' +
      '</form>' +
      '<section class="preview" aria-label="Vista previa">' +
      '<div class="preview-head"><p>Vista previa</p>' +
      '<button class="btn btn-sm" type="button" id="playBtn">▶ Ver animación</button></div>' +
      '<div class="dock" id="dock">' +
      '<div class="dock-title"><span>Stickers</span><small>Toca para agregar · arrastra para mover</small></div>' +
      '<div class="tray" role="group" aria-label="Agregar stickers">' + tray + '</div>' +
      '<div class="tools" id="stTools" hidden>' +
      '<button class="btn btn-sm" type="button" data-st="down" aria-label="Más pequeño">−</button>' +
      '<button class="btn btn-sm" type="button" data-st="up" aria-label="Más grande">+</button>' +
      '<button class="btn btn-sm" type="button" data-st="left" aria-label="Girar a la izquierda">↺</button>' +
      '<button class="btn btn-sm" type="button" data-st="right" aria-label="Girar a la derecha">↻</button>' +
      '<button class="btn btn-sm btn-danger" type="button" data-st="del">Quitar</button>' +
      '</div></div>' +
      '<div class="phone"><div class="phone-screen" id="inv-root"></div></div>' +
      '</section></div>' +
      '<nav class="tabs" aria-label="Cambiar entre editar y vista previa">' +
      '<button type="button" class="is-active" data-tab="edit">Editar</button>' +
      '<button type="button" data-tab="preview">Vista previa</button></nav>' +
      '</div>';

    const editor = app.querySelector('.editor');
    const form = app.querySelector('#form');
    const root = app.querySelector('#inv-root');
    const dock = app.querySelector('#dock');
    const tools = app.querySelector('#stTools');
    const saveStateEl = app.querySelector('#saveState');
    const photoThumb = app.querySelector('#photoThumb');
    const photoRemove = app.querySelector('#photoRemove');

    let stopCount = null;
    let paintQueued = false;
    let dirty = false;
    let saveTimer = null;
    let selId = null;
    let hinted = false;

    function setSel(id) {
      selId = id;
      tools.hidden = !id;
    }
    function moveSticker(id, x, y) {
      const s = inv.stickers.find((k) => k.id === id);
      if (s) { s.x = Math.round(x * 10) / 10; s.y = Math.round(y * 10) / 10; markDirty(); }
    }

    // live=true reproduce las animaciones de entrada; mientras se edita se muestra estático
    // y los stickers se pueden arrastrar.
    function paint(live) {
      paintQueued = false;
      if (stopCount) stopCount();
      root.innerHTML = Render.render(tpl, inv, { preview: true });
      stopCount = Render.mount(root, live === true
        ? { live: true }
        : { edit: { selectedId: selId, onSelect: setSel, onMove: moveSticker } });
    }
    function queuePaint() {
      if (!paintQueued) { paintQueued = true; requestAnimationFrame(() => paint(false)); }
    }

    function setSaveState(text) { saveStateEl.textContent = 'Borrador · ' + text; }

    // Guarda el borrador. Devuelve el resultado de Storage.save.
    function saveNow(manual) {
      clearTimeout(saveTimer);
      const res = Storage.save(inv);
      if (res.ok) {
        dirty = false;
        // Una invitación nueva pasa a tener su propia dirección (#/editar/id).
        if (location.hash.indexOf('#/nueva/') === 0) history.replaceState(null, '', '#/editar/' + encodeURIComponent(inv.id));
        setSaveState(res.persistent ? 'guardado' : 'guardado solo en esta pestaña');
        if (manual) toast(res.persistent ? 'Borrador guardado en este dispositivo.' : 'Guardado temporalmente: tu navegador no permite guardar de forma permanente.');
      } else {
        setSaveState('no se pudo guardar');
        toast(res.reason === 'quota'
          ? 'No hay espacio en este dispositivo. Prueba con una foto más pequeña o elimina borradores.'
          : 'No se pudo guardar el borrador.');
      }
      return res;
    }
    function markDirty() {
      dirty = true;
      setSaveState('guardando…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveNow(false), 600);
    }

    function validate(key) {
      const el = form.querySelector('[data-err="' + key + '"]');
      if (!el) return;
      const v = String(data[key] || '').trim();
      let msg = '';
      if (key === 'mapsUrl' && v && !Render.safeUrl(v)) msg = 'Ese enlace no parece válido.';
      if (key === 'whatsapp' && v && !Render.whatsappLink(v, 'x')) msg = 'Escribe tu número a 10 dígitos.';
      el.textContent = msg;
    }

    function refreshPhotoUI() {
      if (!photoThumb) return;
      const has = typeof data.photo === 'string' && data.photo.indexOf('data:image/') === 0;
      photoThumb.innerHTML = has ? '<img alt="" src="' + esc(data.photo) + '">' : 'Sin foto';
      photoRemove.hidden = !has;
    }

    setSaveState(isNew ? 'sin guardar' : 'guardado');
    validate('mapsUrl');
    validate('whatsapp');
    refreshPhotoUI();
    paint(false);

    // Escribir en el formulario → actualiza los datos de ESTA invitación y la vista previa.
    form.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.name || !textKeys.has(el.name)) return;
      data[el.name] = el.value;
      validate(el.name);
      queuePaint();
      markDirty();
    });

    form.addEventListener('input', (e) => {
      if (e.target.id !== 'customColor') return;
      const hex = String(e.target.value || '').replace('#', '').toLowerCase();
      if (!/^[0-9a-f]{6}$/.test(hex)) return;
      const cur = Catalog.resolvePalette(tpl, inv.paletteId).bg;
      inv.paletteId = Catalog.composePalette(tpl, 'c' + hex, cur && cur.id);
      form.querySelectorAll('[data-palette]').forEach((b) => b.setAttribute('aria-checked', 'false'));
      queuePaint();
      markDirty();
    });

    form.addEventListener('click', (e) => {
      const sw = e.target.closest('[data-palette]');
      if (sw) {
        const cur = Catalog.resolvePalette(tpl, inv.paletteId).bg;
        inv.paletteId = Catalog.composePalette(tpl, sw.getAttribute('data-palette'), cur && cur.id);
        form.querySelectorAll('[data-palette]').forEach((b) => b.setAttribute('aria-checked', String(b === sw)));
        queuePaint();
        markDirty();
        return;
      }
      const bgb = e.target.closest('[data-bg]');
      if (bgb) {
        const pal = Catalog.resolvePalette(tpl, inv.paletteId).palette.id;
        inv.paletteId = Catalog.composePalette(tpl, pal, bgb.getAttribute('data-bg'));
        form.querySelectorAll('[data-bg]').forEach((b) => b.setAttribute('aria-pressed', String(b === bgb)));
        queuePaint();
        markDirty();
        return;
      }
      if (e.target.closest('#photoRemove')) {
        data.photo = '';
        refreshPhotoUI();
        queuePaint();
        markDirty();
        return;
      }
      if (e.target.closest('#publishBtn')) openPublish(tpl, inv, saveNow);
    });

    // Bandeja de stickers
    dock.addEventListener('click', (e) => {
      const add = e.target.closest('[data-add]');
      if (add) {
        if (inv.stickers.length >= 16) { toast('Máximo 16 stickers por invitación.'); return; }
        const st = {
          id: 's' + Math.random().toString(36).slice(2, 8),
          e: add.getAttribute('data-add'),
          x: 30 + Math.random() * 40,
          y: 30 + Math.random() * 30,
          s: 60,
          r: 0
        };
        inv.stickers.push(st);
        setSel(st.id);
        queuePaint();
        markDirty();
        if (!hinted) { hinted = true; toast('Arrástralo en la invitación para moverlo.'); }
        return;
      }
      const act = e.target.closest('[data-st]');
      if (!act) return;
      const idx = inv.stickers.findIndex((k) => k.id === selId);
      if (idx < 0) return;
      const st = inv.stickers[idx];
      const a = act.getAttribute('data-st');
      if (a === 'up') st.s = Math.min(160, st.s + 8);
      else if (a === 'down') st.s = Math.max(24, st.s - 8);
      else if (a === 'left') st.r = Math.max(-360, (st.r || 0) - 15);
      else if (a === 'right') st.r = Math.min(360, (st.r || 0) + 15);
      else if (a === 'del') { inv.stickers.splice(idx, 1); setSel(null); }
      queuePaint();
      markDirty();
    });

    const photoInput = form.querySelector('#photoInput');
    if (photoInput) {
      photoInput.addEventListener('change', async (e) => {
        const input = e.target;
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        if (!/^image\//.test(file.type)) { toast('Elige una imagen (JPG o PNG).'); return; }
        try {
          const url = await fileToDataUrl(file);
          const prev = data.photo;
          data.photo = url;
          const res = saveNow(false);
          if (!res.ok) data.photo = prev; // no cabe: se conserva la foto anterior
          refreshPhotoUI();
          queuePaint();
        } catch (err) {
          toast('No pudimos leer esa imagen. Prueba con otra.');
        }
      });
    }

    app.querySelector('#saveBtn').addEventListener('click', () => saveNow(true));

    // Reproduce la invitación como la verá un invitado (con animaciones).
    app.querySelector('#playBtn').addEventListener('click', () => {
      setSel(null);
      root.scrollTop = 0;
      paint(true);
    });

    editor.querySelector('.tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      editor.setAttribute('data-tab', b.getAttribute('data-tab'));
      editor.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('is-active', x === b));
      window.scrollTo(0, 0);
    });

    function onHide() { if (dirty) saveNow(false); }
    window.addEventListener('pagehide', onHide);

    leave = function () {
      window.removeEventListener('pagehide', onHide);
      if (dirty) saveNow(false);
      clearTimeout(saveTimer);
      if (stopCount) stopCount();
    };
  }

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
